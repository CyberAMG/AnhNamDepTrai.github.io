<body>
<section id="authView" class="auth-wrap">
 <div class="auth-card">
  <div class="brand"><div class="brand-mark">G</div><div><h1>Gaming Hub V2</h1><div class="sub" style="margin:4px 0 0">Không gian chơi game của bạn</div></div></div>
  <h2 id="authTitle">Đăng nhập</h2><p class="sub" id="authSubtitle">Chào mừng bạn quay trở lại.</p>
  <form id="authForm">
   <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div>
   <div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Ít nhất 6 ký tự"></div>
   <button class="primary wide" id="authSubmit" type="submit">Đăng nhập</button>
  </form>
  <div class="auth-actions"><button class="ghost" id="toggleAuth" type="button">Tạo tài khoản mới</button></div>
  <div class="status" id="authStatus" role="status"></div>
 </div>
</section>
<section id="appView" class="app hidden">
 <nav class="server-rail" id="serverRail"><div class="server-icon active" title="Gaming Hub">G</div><div class="rail-divider"></div><button class="server-icon add-server" id="addServer" title="Tạo server">+</button><button class="server-icon" id="joinServer" title="Tham gia server">↗</button><div class="rail-spacer"></div><button class="server-icon rail-settings" id="userSettings" title="Cài đặt tài khoản" aria-label="Cài đặt tài khoản">⚙</button></nav>
 <aside class="side">
  <div class="side-head"><span id="serverName">Gaming Hub</span><button class="icon-btn" id="serverMenu" title="Cài đặt server">⚙</button></div>
  <div class="side-body"><button class="join-server-link" id="joinServerSide" type="button">＋　Tham gia server</button><button class="join-server-link" id="serverCodeSide" type="button" hidden>⌁　Code server</button><div class="section-row"><div class="section-label">KÊNH</div><button class="mini-add" id="addChannelBtn" title="Tạo kênh">＋</button></div><div id="channelList"></div><div class="section-row"><div class="section-label">THÀNH VIÊN</div><button class="mini-add" id="addMemberBtn" title="Mời thành viên">＋</button></div><div id="sideMembers"></div></div>
  <div class="side-bottom"><div class="avatar" id="myAvatar">U</div><div class="user-meta"><strong id="myName">Bạn</strong></div><button class="icon-btn" id="signOut" title="Đăng xuất">↪</button></div>
 </aside>
 <main class="main">
  <header class="topbar"><span id="channelTitle">Chọn một server</span><div class="top-actions"><button class="icon-btn" id="callBtn" title="Gọi thoại / video">◉</button><button class="icon-btn" id="inviteBtn" title="Mã mời">⌁</button></div></header>
  <div class="chat-scroll" id="messages"><div class="welcome"><div class="big">🎮</div><strong>Chào mừng đến Gaming Hub</strong><p>Chọn server hoặc tạo server mới để bắt đầu.</p></div></div>
  <div class="composer-wrap"><form class="composer" id="messageForm"><input id="messageInput" autocomplete="off" placeholder="Chọn kênh để bắt đầu nhắn tin..." disabled><button class="send" type="submit" aria-label="Gửi tin nhắn">➤</button></form></div>
 </main>
 <aside class="member-panel"><div class="section-label">THÀNH VIÊN TRỰC TUYẾN</div><div id="members"></div></aside>
</section>
<div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://zctrdfocxmcwkzqkrtsd.supabase.co';
const SUPABASE_KEY='sb_publishable_sCJwclbCjkuQzVEvZL3XEg_dlsCjzw0';
let db=null,supabaseClientPromise=null;
function getSupabaseClient(){
 if(db)return Promise.resolve(db);
 if(window.supabase&&typeof window.supabase.createClient==='function'){
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return Promise.resolve(db);
 }
 if(!supabaseClientPromise){
  supabaseClientPromise=new Promise((resolve,reject)=>{
   const fallback=document.createElement('script');
   fallback.src='https://unpkg.com/@supabase/supabase-js@2';
   fallback.onload=()=>{
    try{
     if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Thư viện Supabase không khởi tạo được.');
     db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
     resolve(db);
    }catch(error){reject(error)}
   };
   fallback.onerror=()=>reject(new Error('Không tải được thư viện kết nối. Hãy kiểm tra Internet hoặc tắt tiện ích chặn CDN rồi tải lại trang.'));
   document.head.appendChild(fallback);
  }).catch(error=>{supabaseClientPromise=null;throw error});
 }
 return supabaseClientPromise;
}
let currentUser=null,currentServer=null,currentChannel=null,messageSubscription=null,profileSyncSubscription=null,authMode='login',servers=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(s){return (s||'U').trim().slice(0,1).toUpperCase()}
function setStatus(id,msg){$(id).textContent=msg||''}
function showAuth(){ $('authView').classList.remove('hidden');$('appView').classList.add('hidden')}
function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden')}
function openModal(title,fields,submitText,onSubmit){
 const root=$('modalRoot');root.innerHTML='<div class="modal-backdrop"><div class="modal"><h2>'+esc(title)+'</h2>'+fields+'<div class="status" id="modalStatus"></div><div class="modal-actions"><button class="ghost" id="modalCancel">Hủy</button><button class="primary" id="modalSubmit">'+esc(submitText)+'</button></div></div></div>';
 root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))root.innerHTML=''});
 $('modalCancel').onclick=()=>root.innerHTML='';
 $('modalSubmit').onclick=async()=>{const b=$('modalSubmit');b.disabled=true;try{await onSubmit()}catch(e){setStatus('modalStatus',e.message||'Có lỗi xảy ra')}finally{b.disabled=false}};
}
$('toggleAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Đăng nhập':'Tạo tài khoản';$('authSubtitle').textContent=authMode==='login'?'Chào mừng bạn quay trở lại.':'Đăng ký bằng email và mật khẩu.';$('authSubmit').textContent=authMode==='login'?'Đăng nhập':'Đăng ký';$('toggleAuth').textContent=authMode==='login'?'Tạo tài khoản mới':'Đã có tài khoản? Đăng nhập';setStatus('authStatus','')};
$('authForm').onsubmit=async e=>{
 e.preventDefault();
 const email=$('email').value.trim(),password=$('password').value;
 const b=$('authSubmit');b.disabled=true;setStatus('authStatus','Đang kết nối...');
 try{
  const client=await getSupabaseClient();
  if(!email||!password)throw new Error('Hãy nhập email và mật khẩu.');
  if(authMode==='signup'){
   const {data,error}=await client.auth.signUp({email,password,options:{data:{username:email.split('@')[0]},emailRedirectTo:'https://cyberamg.github.io/AnhNamDepTrai.github.io/'}});
   if(error)throw error;
   if(data.session&&data.user){currentUser=data.user;await enterApp()}
   else setStatus('authStatus','Đăng ký thành công! Hãy kiểm tra email để xác minh, sau đó đăng nhập.');
  }else{
   const {data,error}=await client.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(!data.user)throw new Error('Xác thực chưa trả về tài khoản. Hãy thử lại.');
   currentUser=data.user;
   await enterApp();
  }
 }catch(err){
  showAuth();
  console.error('Gaming Hub authentication error:',err);
  setStatus('authStatus',err&&err.message?err.message:'Không thể đăng nhập. Hãy thử lại.');
 }finally{b.disabled=false}
};
$('userSettings').onclick=openUserSettings;
$('myAvatar').title='Xem trang cá nhân';$('myAvatar').style.cursor='pointer';$('myAvatar').onclick=openMyProfile;$('myName').title='Xem trang cá nhân';$('myName').style.cursor='pointer';$('myName').onclick=openMyProfile;
$('signOut').onclick=async()=>{if(messageSubscription)await db.removeChannel(messageSubscription);if(profileSyncSubscription)await db.removeChannel(profileSyncSubscription);messageSubscription=null;profileSyncSubscription=null;await db.auth.signOut();currentUser=null;currentServer=null;currentChannel=null;callProfileCache.clear();showAuth()};
function showInviteModal(server=currentServer){
 if(!server)return;
 const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('invite',server.invite_code||'');
 openModal('Mã server','<div class="notice">Chia sẻ mã hoặc đường link này. Người nhận sẽ được hỏi xác nhận trước khi tham gia.</div><div class="field"><label>Mã server</label><input id="inviteCodeDisplay" readonly value="'+esc(server.invite_code||'Chưa có mã')+'"></div><div class="field"><label>Đường link tham gia</label><input id="inviteLinkDisplay" readonly value="'+esc(url.toString())+'"></div>','Sao chép link',async()=>{
  if(!server.invite_code)throw Error('Server chưa có mã.');
  await navigator.clipboard.writeText(url.toString());
  setStatus('modalStatus','Đã sao chép link server!');
  setTimeout(()=>{$('modalRoot').innerHTML=''},700);
 });
}
function updateJoinControls(){const joined=!!currentServer;$('joinServerSide').textContent='＋　Tham gia server';$('joinServerSide').title='Tham gia thêm server';$('serverCodeSide').hidden=!joined;$('serverCodeSide').onclick=()=>{if(currentServer)showInviteModal(currentServer)};$('joinServer').classList.toggle('hidden',joined);$('serverMenu').title=joined?'Cài đặt server':'Tạo server';$('serverMenu').textContent=joined?'⚙':'＋'}
function openServerSettings(){if(!currentServer){openCreateServer();return}const s=currentServer;openModal('Cài đặt server','<div class="field"><label>Tên server</label><input id="renameServerInput" maxlength="50" value="'+esc(s.name)+'" placeholder="Tên server"></div>','Lưu thay đổi',async()=>{const name=$('renameServerInput').value.trim();if(!name)throw Error('Tên server không được để trống.');const {data,error}=await db.from('servers').update({name}).eq('id',s.id).select('id,name,invite_code,owner_id,created_at').single();if(error)throw error;currentServer=data;servers=servers.map(x=>x.id===data.id?data:x);$('modalRoot').innerHTML='';await loadServers();await selectServer(data.id)})}
function openCreateServer(){openModal('Tạo server','<div class="field"><label>Tên server</label><input id="serverInput" maxlength="50" placeholder="Ví dụ: Hội bạn thân"></div>','Tạo',async()=>{const name=$('serverInput').value.trim();if(!name)throw Error('Hãy nhập tên server.');const {data,error}=await db.rpc('create_server',{server_name:name});if(error)throw error;$('modalRoot').innerHTML='';await loadServers();await selectServer(data)})}
async function handleInviteUrl(){const params=new URLSearchParams(location.search),code=params.get('invite');if(!code)return;const already=servers.find(s=>s.invite_code===code);if(already){await selectServer(already.id);params.delete('invite');history.replaceState({},'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash);return}openModal('Lời mời tham gia server','<div class="notice">Bạn được mời tham gia một server trên Gaming Hub. Bạn có muốn tham gia server này không?</div>','Tham gia server',async()=>{const {data,error}=await db.rpc('join_server_by_code',{code});if(error)throw error;$('modalRoot').innerHTML='';params.delete('invite');history.replaceState({},'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash);await loadServers();await selectServer(data)})}
function closeServerContext(){const menu=$('serverContextMenu');if(menu)menu.remove()}
function showServerContext(event,server){
 event.preventDefault();closeServerContext();
 const menu=document.createElement('div');menu.id='serverContextMenu';menu.className='server-context';
 menu.innerHTML='<button type="button" data-action="invite">＋　Mời thành viên</button><button type="button" class="danger" data-action="delete">⌫　Xóa server</button>';
 document.body.append(menu);
 const x=Math.min(event.clientX,window.innerWidth-190),y=Math.min(event.clientY,window.innerHeight-100);
 menu.style.left=Math.max(8,x)+'px';menu.style.top=Math.max(8,y)+'px';
  menu.querySelector('[data-action="delete"]').onclick=()=>{closeServerContext();confirmDeleteServer(server)};
 menu.que
  menu.querySelector('[data-action="invite"]').onclick=()=>{closeServerContext();showInviteModal(server)};
  setTimeout(()=>document.addEventListener('click',closeServerContext,{once:true}),0);
}
function confirmDeleteServer(server){
 openModal('Xóa server?','<div class="notice">Bạn sắp xóa vĩnh viễn server <b>'+esc(server.name)+'</b>. Thành viên, kênh và tin nhắn thuộc server này cũng có thể bị xóa theo.</div><p style="color:#ff9da3;font-size:13px">Thao tác này không thể hoàn tác.</p>','Xóa server',async()=>{
  const {error}=await db.from('servers').delete().eq('id',server.id);
  if(error)throw error;
  $('modalRoot').innerHTML='';
  if(currentServer?.id===server.id){
   if(messageSubscription){await db.removeChannel(messageSubscription);messageSubscription=null}
   currentServer=null;currentChannel=null;
  }
  servers=servers.filter(s=>s.id!==server.id);
  await loadServers();
 });
}
$('addMemberBtn').onclick=()=>showInviteModal();
$('inviteBtn').onclick=()=>showInviteModal();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeServerContext();$('modalRoot').innerHTML=''}});

function mixColor(a,b,amount){const x=a.match(/[0-9a-f]{2}/gi)||['00','00','00'],y=b.match(/[0-9a-f]{2}/gi)||['ff','ff','ff'];return '#'+x.map((v,i)=>Math.round(parseInt(v,16)*(1-amount)+parseInt(y[i],16)*amount).toString(16).padStart(2,'0')).join('')}
async function loadOwnProfile(){
 if(!currentUser)return;
 const {data,error}=await db.from('profiles').select('id,username,avatar_url,bio,banner_url,banner_color,theme_mode,accent_color,background_color,panel_color').eq('id',currentUser.id).maybeSingle();
 if(error)throw error;
 ownProfile={...ownProfile,...(data||{}),username:data?.username||currentUser.email?.split('@')[0]||'Bạn'};
 ownProfile.banner_color=safeColor(ownProfile.banner_color,'#5865f2');
 ownProfile.accent_color=safeColor(ownProfile.accent_color,'#5865f2');
 ownProfile.background_color=safeColor(ownProfile.background_color,'#000000');
 ownProfile.panel_color=safeColor(ownProfile.panel_color,'#08090b');
 paintOwnProfile();
 if(typeof callProfileCache!=='undefined')callProfileCache.set(currentUser.id,{id:currentUser.id,...ownProfile});

async function startProfileSync(){
 if(profileSyncSubscription){await db.removeChannel(profileSyncSubscription);profileSyncSubscription=null}
 profileSyncSubscription=db.channel('profile-sync-'+currentUser.id)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},payload=>{
   const p=payload.new;if(!p?.id)return;
   callProfileCache.set(p.id,{...(callProfileCache.get(p.id)||{}),...p});
   if(p.id===currentUser.id){ownProfile={...ownProfile,...p};paintOwnProfile()}
   refreshProfileViews(p.id,true);
  }).subscribe();
}
function messageProfile(userId){
 if(userId===currentUser?.id)return ownProfile;
 return callProfileCache.get(userId)||{};
}
function paintMessageIdentity(node){

 const heading=node.querySelector('.msg-head strong');
 const avatar=node.querySelector('.msg-avatar');

function refreshProfileViews(userId,refreshMembers=false){

 if(tile){
  const p=messageProfile(userId);
  const name=p.username||(userId===currentUser?.id?currentUser?.email?.split('@')[0]:'Thành viên')||'Thành viên';
  const label=tile.querySelector('.call-name');if(label)label.textContent=name;
  const initial=tile.querySelector('.call-avatar-initial');if(initial){initial.textContent=initials(name);initial.hidden=!!p.avatar_url}

  if(img){if(p.avatar_url){img.src=p.avatar_url;img.hidden=false}else{img.removeAttribute('src');img.hidden=true}}
 }
 if(refreshMembers&&currentServer)loadMembers(currentServer.id).catch(error=>console.warn('Không thể đồng bộ danh sách thành viên:',error));
}
async function cacheMessageProfiles(messages){
 const ids=[...new Set((messages||[]).map(m=>m.sender_id).filter(id=>id&&id!==currentUser?.id&&!callProfileCache.has(id)))];
 if(!ids.length)return;
 const {data,error}=await db.from('profiles').select('id,username,avatar_url').in('id',ids);
 if(error){console.warn('Không tải được hồ sơ người gửi:',error);return}
 (data||[]).forEach(p=>callProfileCache.set(p.id,p));
}
async function loadMessageProfile(userId){

}

  livekitRoom.on(lk.RoomEvent.LocalTrackUnpublished,(publication)=>{if(publication.track)detachCallTrack(publication.track)});
  livekitRoom.on(lk.RoomEvent.ParticipantConnected,p=>{callTile(p.identity);callStatus('Đã kết nối • '+(livekitRoom.remoteParticipants.size+1)+' người')});
  livekitRoom.on(lk.RoomEvent.ParticipantDisconnected,p=>{document.querySelector('[data-call-peer="'+CSS.escape(p.identity)+'"]')?.remove();callStatus('Một thành viên đã rời cuộc gọi')});
  livekitRoom.on(lk.RoomEvent.Disconnected,()=>{callStatus('Đã ngắt kết nối')});
  livekitRoom.on(lk.RoomEvent.LocalTrackPublished,(publication,participant)=>{if(publication.track&&publication.track.kind==='video')attachCallTrack(publication.track,participant)});
  await livekitRoom.connect(data.serverUrl,data.token);
  callTile(currentUser.id);
  livekitRoom.remoteParticipants.forEach(participant=>{callTile(participant.identity);participant.trackPublications.forEach(publication=>{if(publication.isSubscribed&&publication.track)attachCallTrack(publication.track,participant)})});
  await livekitRoom.localParticipant.setMicrophoneEnabled(true);callMicOn=true;
  $('callMic').textContent='🎙';$('callMic').title='Tắt mic';$('callMic').classList.add('is-on');$('callMic').classList.remove('is-muted');callTile(currentUser.id);callStatus('Đã vào phòng thoại • Chờ thành viên khác tham gia');
 }catch(e){callStatus('Lỗi kết nối: '+(e.message||'Không rõ nguyên nhân'));if(livekitRoom){try{await livekitRoom.disconnect()}catch{}livekitRoom=null}livekitCallChannelId=null;}finally{callConnecting=false}
}
async function leaveCall(){if(livekitRoom){try{await livekitRoom.disconnect()}catch{}livekitRoom=null}livekitCallChannelId=null;callMicOn=true;callCameraOn=false;callScreenOn=false;callConnecting=false;$('callOverlay')?.remove()}
$('callBtn').onclick=startCall;

(async()=>{
 try{
  const client=await getSupabaseClient();
  client.auth.onAuthStateChange((event,session)=>{
   if(event==='SIGNED_OUT'){
    currentUser=null;currentServer=null;currentChannel=null;
    showAuth();
   }
  });
  const {data,error}=await client.auth.getSession();
  if(error)throw error;
  if(data.session){
   currentUser=data.session.user;
   await enterApp();
  }
 }catch(error){
  console.error('Gaming Hub startup/auth error:',error);
  showAuth();
  setStatus('authStatus',error&&error.message?error.message:'Không thể khởi tạo đăng nhập. Hãy tải lại trang.');
 }
})();
</script>
