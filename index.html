.auth-card{width:min(420px,100%);background:#1b1c22;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand-mark{width:44px;height:44px;border-radius:15px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:20px}.brand h1{font-size:20px;margin:0}.sub{color:var(--muted);margin:5px 0 22px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:#c9cad1;font-size:13px}.field input{width:100%;background:#111318;border:1px solid #353743;border-radius:11px;padding:13px;color:white;outline:none}.field input:focus{border-color:var(--accent)}.primary{background:var(--accent);padding:12px 16px;border-radius:11px;font-weight:700}.primary:hover{background:var(--accent2)}.wide{width:100%}.ghost{background:transparent;color:#b9bdca;padding:10px;border-radius:10px}.ghost:hover{background:#ffffff10}.auth-actions{display:flex;gap:8px;margin-top:18px}.status{min-height:20px;color:#ffb4b8;font-size:13px;margin-top:12px}.app{height:100vh;display:flex;min-width:0}.server-rail{width:76px;background:#15161a;display:flex;align-items:center;flex-direction:column;gap:11px;padding:14px 0;overflow:auto}.server-icon{width:48px;height:48px;border-radius:17px;background:#292b32;display:grid;place-items:center;font-size:17px;font-weight:750;transition:.18s;flex-shrink:0}.server-icon:hover,.server-icon.active{background:var(--accent);border-radius:14px}.rail-divider{width:30px;height:1px;background:#363842;flex-shrink:0}.add-server{background:#202b27;color:#56cf94;font-size:25px}.side{width:238px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid #111}.side-head{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-weight:750}.side-body{padding:15px 10px;overflow:auto;flex:1}.join-server-link{width:100%;display:flex;align-items:center;text-align:left;background:#252832;color:#cbd0ff;border:1px solid #363b50;border-radius:10px;padding:11px 12px;margin:0 0 12px;font-weight:650}.join-server-link:hover{background:#30364a;color:#fff}.join-server-link:disabled{opacity:.8;cursor:default}.section-label{font-size:10px;letter-spacing:1.1px;color:var(--muted);font-weight:800;padding:13px 9px 8px}.channel{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;color:#aeb1bc;cursor:pointer;margin:2px 0}.channel:hover,.channel.active{background:#30323a;color:white}.channel .hash{color:#737887;font-size:17px}.side-bottom{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#5865f2;display:grid;place-items:center;font-weight:700;flex-shrink:0}.user-meta{min-width:0;flex:1}.user-meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-meta small{color:var(--muted)}.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel2)}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);font-weight:700}.top-actions{display:flex;gap:8px}.icon-btn{width:36px;height:36px;border-radius:50%;background:#30323a;color:#d8d9e0}.icon-btn:hover{background:#41444e}.chat-scroll{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:18px}.welcome{margin:auto;text-align:center;color:var(--muted);max-width:420px}.welcome .big{font-size:44px;margin-bottom:12px}.msg{display:flex;gap:11px;align-items:flex-start}.msg-content{min-width:0}.msg-head{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}.msg-head strong{font-size:14px}.msg-head time{font-size:11px;color:var(--muted)}.msg-text{color:#d7d8df;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.composer-wrap{padding:12px 20px 18px}.composer{height:52px;background:#383a43;border-radius:28px;display:flex;align-items:center;padding:5px 6px 5px 18px;gap:8px}.composer input{background:transparent;border:0;outline:0;flex:1;min-width:0;color:white}.send{width:40px;height:40px;border-radius:50%;background:var(--accent);font-size:17px}.send:hover{background:var(--accent2)}.empty-note{text-align:center;color:var(--muted);margin:auto}.member-panel{width:210px;background:var(--panel);border-left:1px solid #111;padding:20px 14px;overflow:auto}.member{display:flex;align-items:center;gap:9px;padding:8px 4px;color:#c4c6cf}.online{width:8px;height:8px;border-radius:50%;background:var(--green)}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(400px,100%);background:#202127;border:1px solid var(--line);border-radius:18px;padding:22px}.modal h2{font-size:18px;margin:0 0 16px}.modal .field{margin:12px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:10px 12px;background:#272a36;border:1px solid #3b4057;color:#cbd0ff;border-radius:10px;font-size:12px;line-height:1.5}.section-row{display:flex;align-items:center;justify-content:space-between}.section-row .section-label{padding-right:4px}.mini-add{width:25px;height:25px;border-radius:8px;background:#292b33;color:#bfc3d0;font-size:17px;line-height:1}.mini-add:hover{background:var(--accent);color:white}.server-context{position:fixed;z-index:20;min-width:176px;padding:6px;background:#22242b;border:1px solid #3b3e49;border-radius:12px;box-shadow:0 14px 40px #0009}.server-context button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;background:transparent;color:#e6e7ed}.server-context button:hover{background:#ffffff12}.server-context .danger{color:#ff858d}

:root{--bg:#000000;--panel:#08090b;--panel2:#0d0e11;--line:#1b1d22;--muted:#858995;--text:#f1f2f5}

.call-overlay{position:fixed;inset:0;z-index:80;background:#050506f5;display:flex;flex-direction:column;padding:18px;gap:14px;transition:all .22s ease}
.call-overlay.voice-only{inset:auto 50% 22px auto;transform:translateX(50%);width:min(520px,calc(100vw - 24px));height:auto;max-height:120px;padding:12px 16px;background:#17181df2;border:1px solid #343640;border-radius:32px;box-shadow:0 16px 55px #000b;backdrop-filter:blur(24px)}
.call-overlay.voice-only .call-stage,.call-overlay.voice-only .call-settings{display:none}
.call-overlay.voice-only .call-head{display:none}
.call-overlay.voice-only .call-status{font-size:11px;margin-bottom:4px}
.call-overlay.minimized{inset:auto 16px 16px auto;transform:none;width:min(360px,calc(100vw - 32px));height:auto;max-height:70px;padding:10px 14px;border:1px solid #343744;border-radius:28px;box-shadow:0 12px 50px #000b}
.call-overlay.minimized .call-stage,.call-overlay.minimized .call-settings,.call-overlay.minimized .call-controls{display:none}
.call-overlay.minimized .call-head{min-height:42px}
.call-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.call-head strong{font-size:15px}
.call-stage{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px;align-content:center;overflow:auto}
.call-tile{position:relative;min-height:220px;background:#111217;border:1px solid #292b34;border-radius:28px;overflow:hidden;display:grid;place-items:center}
.call-tile video{width:100%;height:100%;max-height:calc(100vh - 230px);object-fit:contain;background:#050506}
.call-tile audio{display:none}
.call-tile .call-name{position:absolute;left:12px;bottom:10px;background:#000a;padding:6px 10px;border-radius:20px;font-size:12px}
.call-controls{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.call-controls button{width:54px;height:54px;padding:0;border:1px solid #41434d;border-radius:50%;background:#292b33;color:#fff;display:grid;place-items:center;font-size:0;box-shadow:0 5px 18px #0005;transition:transform .15s,background .15s}
.call-controls button:active{transform:scale(.92)}
.call-controls button:disabled{opacity:.55;cursor:wait}
.call-controls button.is-on{background:linear-gradient(145deg,#2b9b79,#176b59);border-color:#48c9a0;color:#fff}
.call-controls button.is-muted{background:linear-gradient(145deg,#b83b52,#76283c);border-color:#e46a7d;color:#fff}
.call-controls button#callCamera{background:linear-gradient(145deg,#6c63df,#4439a5);border-color:#958cff}
.call-controls button#callCamera.is-on{background:linear-gradient(145deg,#259c91,#176b70);border-color:#5ad8c8}
.call-controls button#callScreen{background:linear-gradient(145deg,#3d83cf,#28518d);border-color:#71b5ff}
.call-controls button.hangup{background:linear-gradient(145deg,#ef5265,#b52e48);border-color:#ff8291}
.call-controls button{font-size:21px;line-height:1}

.call-controls button::first-letter{font-size:20px}
.call-controls .hangup{background:#ed4355;border-color:#ed4355}
.call-status{color:#b7bac5;font-size:12px;text-align:center}
.call-settings{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.call-settings label{display:flex;align-items:center;gap:6px;color:#aeb2bf;font-size:12px}
.call-settings select{background:#20222a;color:#fff;border:1px solid #41434d;border-radius:20px;padding:8px 12px}
.call-overlay.voice-only .call-controls{gap:12px}
@media(max-width:650px){.call-overlay{padding:10px}.call-tile{min-height:180px}.call-overlay.voice-only{bottom:12px}.call-controls{gap:10px}.call-controls button{width:50px;height:50px}}.call-tile{min-height:180px}.call-controls button{padding:0}
</style>
</head>
<body>
<section id="authView" class="auth-wrap">
 <div class="auth-card">
  <div class="brand"><div class="brand-mark">G</div><div><h1>Gaming Hub V2</h1><div class="sub" style="margin:4px 0 0">Không gian chơi game của bạn</div></div></div>
  <h2 id="authTitle">Đăng nhập</h2><p class="sub" id="authSubtitle">Chào mừng bạn quay trở lại.</p>
  <form id="authForm">
   <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div>
   <div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Ít nhất 6 ký tự"></div>
   <button class="primary wide" id="authSubmit" type="submit">Đăng nhập</button>
  </form>
  <div class="auth-actions"><button class="ghost" id="toggleAuth" type="button">Tạo tài khoản mới</button></div>
  <div class="status" id="authStatus" role="status"></div>
 </div>
</section>
<section id="appView" class="app hidden">
 <nav class="server-rail" id="serverRail"><div class="server-icon active" title="Gaming Hub">G</div><div class="rail-divider"></div><button class="server-icon add-server" id="addServer" title="Tạo server">+</button><button class="server-icon" id="joinServer" title="Tham gia server">↗</button></nav>
 <aside class="side">
  <div class="side-head"><span id="serverName">Gaming Hub</span><button class="icon-btn" id="serverMenu" title="Cài đặt server">⚙</button></div>
  <div class="side-body"><button class="join-server-link" id="joinServerSide" type="button">＋　Tham gia server</button><button class="join-server-link" id="serverCodeSide" type="button" hidden>⌁　Code server</button><div class="section-row"><div class="section-label">KÊNH</div><button class="mini-add" id="addChannelBtn" title="Tạo kênh">＋</button></div><div id="channelList"></div><div class="section-row"><div class="section-label">THÀNH VIÊN</div><button class="mini-add" id="addMemberBtn" title="Mời thành viên">＋</button></div><div id="sideMembers"></div></div>
  <div class="side-bottom"><div class="avatar" id="myAvatar">U</div><div class="user-meta"><strong id="myName">Bạn</strong><small>Đang hoạt động</small></div><button class="icon-btn" id="signOut" title="Đăng xuất">↪</button></div>
 </aside>
 <main class="main">
  <header class="topbar"><span id="channelTitle">Chọn một server</span><div class="top-actions"><button class="icon-btn" id="callBtn" title="Gọi thoại / video">◉</button><button class="icon-btn" id="inviteBtn" title="Mã mời">⌁</button></div></header>
  <div class="chat-scroll" id="messages"><div class="welcome"><div class="big">🎮</div><strong>Chào mừng đến Gaming Hub</strong><p>Chọn server hoặc tạo server mới để bắt đầu.</p></div></div>
  <div class="composer-wrap"><form class="composer" id="messageForm"><input id="messageInput" autocomplete="off" placeholder="Chọn kênh để bắt đầu nhắn tin..." disabled><button class="send" type="submit" aria-label="Gửi tin nhắn">➤</button></form></div>
 </main>
 <aside class="member-panel"><div class="section-label">THÀNH VIÊN TRỰC TUYẾN</div><div id="members"></div></aside>
</section>
<div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://zctrdfocxmcwkzqkrtsd.supabase.co';
const SUPABASE_KEY='sb_publishable_sCJwclbCjkuQzVEvZL3XEg_dlsCjzw0';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentServer=null,currentChannel=null,messageSubscription=null,authMode='login',servers=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(s){return (s||'U').trim().slice(0,1).toUpperCase()}
function setStatus(id,msg){$(id).textContent=msg||''}
function showAuth(){ $('authView').classList.remove('hidden');$('appView').classList.add('hidden')}
function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden')}
function openModal(title,fields,submitText,onSubmit){
 const root=$('modalRoot');root.innerHTML='<div class="modal-backdrop"><div class="modal"><h2>'+esc(title)+'</h2>'+fields+'<div class="status" id="modalStatus"></div><div class="modal-actions"><button class="ghost" id="modalCancel">Hủy</button><button class="primary" id="modalSubmit">'+esc(submitText)+'</button></div></div></div>';
 root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))root.innerHTML=''});
 $('modalCancel').onclick=()=>root.innerHTML='';
 $('modalSubmit').onclick=async()=>{const b=$('modalSubmit');b.disabled=true;try{await onSubmit()}catch(e){setStatus('modalStatus',e.message||'Có lỗi xảy ra')}finally{b.disabled=false}};
}
$('toggleAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Đăng nhập':'Tạo tài khoản';$('authSubtitle').textContent=authMode==='login'?'Chào mừng bạn quay trở lại.':'Đăng ký bằng email và mật khẩu.';$('authSubmit').textContent=authMode==='login'?'Đăng nhập':'Đăng ký';$('toggleAuth').textContent=authMode==='login'?'Tạo tài khoản mới':'Đã có tài khoản? Đăng nhập';setStatus('authStatus','')};
$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;const b=$('authSubmit');b.disabled=true;setStatus('authStatus','Đang xử lý...');try{if(authMode==='signup'){const {data,error}=await db.auth.signUp({email,password,options:{data:{username:email.split('@')[0]},emailRedirectTo:'https://cyberamg.github.io/AnhNamDepTrai.github.io/'}});if(error)throw error;if(data.session){currentUser=data.user;await enterApp()}else setStatus('authStatus','Đăng ký thành công! Hãy kiểm tra email để xác minh, sau đó đăng nhập.')}else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;currentUser=data.user;await enterApp()}}catch(err){setStatus('authStatus',err.message)}finally{b.disabled=false}};
$('signOut').onclick=async()=>{if(messageSubscription)await db.removeChannel(messageSubscription);await db.auth.signOut();currentUser=null;currentServer=null;currentChannel=null;showAuth()};
function showInviteModal(server=currentServer){
 if(!server)return;
 const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('invite',server.invite_code||'');
 openModal('Mã server','<div class="notice">Chia sẻ mã hoặc đường link này. Người nhận sẽ được hỏi xác nhận trước khi tham gia.</div><div class="field"><label>Mã server</label><input id="inviteCodeDisplay" readonly value="'+esc(server.invite_code||'Chưa có mã')+'"></div><div class="field"><label>Đường link tham gia</label><input id="inviteLinkDisplay" readonly value="'+esc(url.toString())+'"></div>','Sao chép link',async()=>{
  if(!server.invite_code)throw Error('Server chưa có mã.');
  await navigator.clipboard.writeText(url.toString());
  setStatus('modalStatus','Đã sao chép link server!');
  setTimeout(()=>{$('modalRoot').innerHTML=''},700);
 });
}
function updateJoinControls(){const joined=!!currentServer;$('joinServerSide').textContent='＋　Tham gia server';$('joinServerSide').title='Tham gia thêm server';$('serverCodeSide').hidden=!joined;$('serverCodeSide').onclick=()=>{if(currentServer)showInviteModal(currentServer)};$('joinServer').classList.toggle('hidden',joined);$('serverMenu').title=joined?'Cài đặt server':'Tạo server';$('serverMenu').textContent=joined?'⚙':'＋'}
function openServerSettings(){if(!currentServer){openCreateServer();return}const s=currentServer;openModal('Cài đặt server','<div class="field"><label>Tên server</label><input id="renameServerInput" maxlength="50" value="'+esc(s.name)+'" placeholder="Tên server"></div>','Lưu thay đổi',async()=>{const name=$('renameServerInput').value.trim();if(!name)throw Error('Tên server không được để trống.');const {data,error}=await db.from('servers').update({name}).eq('id',s.id).select('id,name,invite_code,owner_id,created_at').single();if(error)throw error;currentServer=data;servers=servers.map(x=>x.id===data.id?data:x);$('modalRoot').innerHTML='';await loadServers();await selectServer(data.id)})}
function openCreateServer(){openModal('Tạo server','<div class="field"><label>Tên server</label><input id="serverInput" maxlength="50" placeholder="Ví dụ: Hội bạn thân"></div>','Tạo',async()=>{const name=$('serverInput').value.trim();if(!name)throw Error('Hãy nhập tên server.');const {data,error}=await db.rpc('create_server',{server_name:name});if(error)throw error;$('modalRoot').innerHTML='';await loadServers();await selectServer(data)})}
async function handleInviteUrl(){const params=new URLSearchParams(location.search),code=params.get('invite');if(!code)return;const already=servers.find(s=>s.invite_code===code);if(already){await selectServer(already.id);params.delete('invite');history.replaceState({},'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash);return}openModal('Lời mời tham gia server','<div class="notice">Bạn được mời tham gia một server trên Gaming Hub. Bạn có muốn tham gia server này không?</div>','Tham gia server',async()=>{const {data,error}=await db.rpc('join_server_by_code',{code});if(error)throw error;$('modalRoot').innerHTML='';params.delete('invite');history.replaceState({},'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash);await loadServers();await selectServer(data)})}
function closeServerContext(){const menu=$('serverContextMenu');if(menu)menu.remove()}
function showServerContext(event,server){
 event.preventDefault();closeServerContext();
 const menu=document.createElement('div');menu.id='serverContextMenu';menu.className='server-context';
 menu.innerHTML='<button type="button" data-action="invite">＋　Mời thành viên</button><button type="button" class="danger" data-action="delete">⌫　Xóa server</button>';
 document.body.append(menu);
 const x=Math.min(event.clientX,window.innerWidth-190),y=Math.min(event.clientY,window.innerHeight-100);
 menu.style.left=Math.max(8,x)+'px';menu.style.top=Math.max(8,y)+'px';
 menu.querySelector('[data-action="invite"]').onclick=()=>{closeServerContext();showInviteModal(server)};
 menu.querySelector('[data-action="delete"]').onclick=()=>{closeServerContext();confirmDeleteServer(server)};
 setTimeout(()=>document.addEventListener('click',closeServerContext,{once:true}),0);
}
function confirmDeleteServer(server){
 openModal('Xóa server?','<div class="notice">Bạn sắp xóa vĩnh viễn server <b>'+esc(server.name)+'</b>. Thành viên, kênh và tin nhắn thuộc server này cũng có thể bị xóa theo.</div><p style="color:#ff9da3;font-size:13px">Thao tác này không thể hoàn tác.</p>','Xóa server',async()=>{
  const {error}=await db.from('servers').delete().eq('id',server.id);
  if(error)throw error;
  $('modalRoot').innerHTML='';
  if(currentServer?.id===server.id){
   if(messageSubscription){await db.removeChannel(messageSubscription);messageSubscription=null}
   currentServer=null;currentChannel=null;
  }
  servers=servers.filter(s=>s.id!==server.id);
  await loadServers();
 });
}
$('addMemberBtn').onclick=()=>showInviteModal();
$('inviteBtn').onclick=()=>showInviteModal();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeServerContext();$('modalRoot').innerHTML=''}});
$('addServer').onclick=openCreateServer;$('serverMenu').onclick=openServerSettings;
async function confirmJoinServer(code){openModal('Xác nhận tham gia server','<div class="notice">Bạn có muốn tham gia server này không?</div>','Tham gia server',async()=>{const {data,error}=await db.rpc('join_server_by_code',{code});if(error)throw error;$('modalRoot').innerHTML='';await loadServers();await selectServer(data)})}
function openJoinServer(){openModal('Tham gia server','<div class="notice">Bạn có thể nhập mã server hoặc dán đường link mời.</div><div class="field"><label>Mã server</label><input id="inviteInput" maxlength="80" autocomplete="off" placeholder="Nhập mã server"></div><div class="field"><label>Đường link server</label><input id="inviteUrlInput" maxlength="500" autocomplete="off" placeholder="Dán link mời tại đây"></div>','Tiếp tục',async()=>{let code=$('inviteInput').value.trim();const link=$('inviteUrlInput').value.trim();if(link){try{const parsed=new URL(link);code=parsed.searchParams.get('invite')||''}catch{throw Error('Đường link không hợp lệ.')}}if(!code)throw Error('Hãy nhập mã server hoặc đường link hợp lệ.');$('modalRoot').innerHTML='';await confirmJoinServer(code)});setTimeout(()=>$('inviteInput')?.focus(),50)}
$('joinServer').addEventListener('click',openJoinServer);$('joinServerSide').addEventListener('click',openJoinServer);
$('inviteBtn').onclick=()=>{if(currentServer)showInviteModal(currentServer);else openJoinServer()};
async function enterApp(){showApp();$('myName').textContent=currentUser.email?.split('@')[0]||'Bạn';$('myAvatar').textContent=initials(currentUser.email);await loadServers();updateJoinControls();await handleInviteUrl()}
async function loadServers(){const {data,error}=await db.from('servers').select('id,name,invite_code,owner_id,created_at').order('created_at');if(error)throw error;servers=data||[];const rail=$('serverRail');rail.querySelectorAll('[data-server]').forEach(n=>n.remove());servers.forEach((s,i)=>{const b=document.createElement('button');b.className='server-icon'+(currentServer?.id===s.id?' active':'');b.dataset.server=s.id;b.title=s.name;b.textContent=initials(s.name);b.onclick=()=>selectServer(s.id);b.addEventListener('contextmenu',e=>showServerContext(e,s));$('addServer').before(b)});if(!currentServer&&servers.length)await selectServer(servers[0].id);updateJoinControls();if(!servers.length){currentServer=null;currentChannel=null;updateJoinControls();$('serverName').textContent='Gaming Hub';$('channelList').innerHTML='';$('messages').innerHTML='<div class="welcome"><div class="big">🎮</div><strong>Chưa có server</strong><p>Tạo server mới hoặc tham gia bằng mã mời.</p></div>'; $('messageInput').disabled=true}}
async function selectServer(id){currentServer=servers.find(s=>s.id===id);if(!currentServer)return;updateJoinControls();document.querySelectorAll('[data-server]').forEach(b=>b.classList.toggle('active',b.dataset.server===id));$('serverName').textContent=currentServer.name;const {data:channels,error}=await db.from('channels').select('*').eq('server_id',id).order('created_at');if(error)throw error;$('channelList').innerHTML='';(channels||[]).forEach(ch=>{const el=document.createElement('div');el.className='channel';el.dataset.channel=ch.id;el.innerHTML='<span class="hash">'+(ch.type==='voice'?'◉':'#')+'</span><span>'+esc(ch.name)+'</span>'+(ch.type==='voice'?'<span style="margin-left:auto;color:#858995;font-size:10px">THOẠI</span>':'');el.onclick=()=>selectChannel(ch);$('channelList').append(el)});await loadMembers(id);const firstText=(channels||[]).find(ch=>ch.type!=='voice');if(firstText)await selectChannel(firstText);else{currentChannel=null;$('callBtn').classList.add('hidden');$('messages').innerHTML='<div class="empty-note">Server chưa có kênh chat.</div>';$('messageInput').disabled=true}}
async function loadMembers(serverId){const {data,error}=await db.from('server_members').select('user_id,role').eq('server_id',serverId);if(error)throw error;const ids=(data||[]).map(x=>x.user_id);let profiles=[];if(ids.length){const r=await db.from('profiles').select('id,username,avatar_url').in('id',ids);if(!r.error)profiles=r.data||[]}const html=(data||[]).map(m=>{const p=profiles.find(x=>x.id===m.user_id);return '<div class="member"><span class="online"></span><span>'+esc(p?.username||'Thành viên')+'</span></div>'}).join('')||'<div class="member">Chưa có thành viên</div>';$('members').innerHTML=html;$('sideMembers').innerHTML=html}
async function selectChannel(ch){if(ch.type==='voice'&&livekitRoom&&livekitCallChannelId&&livekitCallChannelId!==ch.id)await leaveCall();currentChannel=ch;document.querySelectorAll('#channelList .channel').forEach(el=>el.classList.toggle('active',el.dataset.channel===ch.id));if(ch.type==='voice'){$('callBtn').classList.remove('hidden');if(messageSubscription){await db.removeChannel(messageSubscription);messageSubscription=null}$('channelTitle').textContent='◉ '+ch.name;$('messageInput').disabled=true;$('messageInput').placeholder='Phòng thoại đang hoạt động';$('messages').innerHTML='<div class="empty-note">Đang mở phòng thoại...</div>';document.querySelector('.composer-wrap')?.classList.add('hidden');await startCall();return}$('callBtn').classList.add('hidden');$('channelTitle').textContent='# '+ch.name;$('messageInput').disabled=false;$('messageInput').placeholder='Nhắn tin trong #'+ch.name;document.querySelector('.composer-wrap')?.classList.remove('hidden');$('messages').innerHTML='';await loadMessages();if(messageSubscription)await db.removeChannel(messageSubscription);messageSubscription=db.channel('messages-'+ch.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+ch.id},payload=>appendMessage(payload.new)).subscribe()}

function openCreateChannel(){
 if(!currentServer){alert('Hãy chọn server trước.');return}
 openModal('Tạo kênh','<div class="field"><label>Tên kênh</label><input id="newChannelName" maxlength="40" placeholder="Ví dụ: Phòng chơi game"></div><div class="field"><label>Loại kênh</label><select id="newChannelType" style="width:100%;background:#111318;color:white;border:1px solid #353743;border-radius:11px;padding:12px"><option value="text"># Kênh chat</option><option value="voice">◉ Phòng thoại</option></select></div>','Tạo kênh',async()=>{
  const name=$('newChannelName').value.trim(),type=$('newChannelType').value;if(!name)throw Error('Hãy nhập tên kênh.');
  const {data,error}=await db.from('channels').insert({server_id:currentServer.id,name,type}).select('*').single();if(error)throw error;
  $('modalRoot').innerHTML='';await selectServer(currentServer.id);if(type==='voice')await selectChannel(data);
 });
}
$('addChannelBtn').onclick=openCreateChannel;

function appendMessage(m){if(!currentChannel||m.channel_id!==currentChannel.id)return;const node=document.createElement('div');node.className='msg';const name=m.sender_id===currentUser.id?'Bạn':'Thành viên';node.innerHTML='<div class="avatar">'+(name==='Bạn'?'B':'U')+'</div><div class="msg-content"><div class="msg-head"><strong>'+name+'</strong><time>'+new Date(m.created_at).toLocaleString('vi-VN')+'</time></div><div class="msg-text">'+esc(m.content)+'</div></div>';$('messages').append(node);$('messages').scrollTop=$('messages').scrollHeight}
async function loadMessages(){const {data,error}=await db.from('messages').select('*').eq('channel_id',currentChannel.id).order('created_at',{ascending:true}).limit(100);if(error)throw error;$('messages').innerHTML='';if(!data?.length){$('messages').innerHTML='<div class="empty-note">Chưa có tin nhắn. Hãy bắt đầu cuộc trò chuyện!</div>';return}data.forEach(appendMessage)}
$('messageForm').onsubmit=async e=>{e.preventDefault();const input=$('messageInput'),content=input.value.trim();if(!content||!currentChannel)return;input.value='';const {error}=await db.from('messages').insert({channel_id:currentChannel.id,sender_id:currentUser.id,content});if(error){input.value=content;alert('Không gửi được tin nhắn: '+error.message)}};

let livekitRoom=null,livekitCallChannelId=null,callMicOn=true,callCameraOn=false,callScreenOn=false,callConnecting=false;
function callStatus(message){const el=$('callStatus');if(el)el.textContent=message||''}
function callTile(identity){let tile=document.querySelector('[data-call-peer="'+CSS.escape(identity)+'"]');if(!tile){tile=document.createElement('div');tile.className='call-tile';tile.dataset.callPeer=identity;tile.innerHTML='<div class="call-name">'+esc(identity===currentUser.id?'Bạn':identity.slice(0,8))+'</div>';$('callStage').append(tile)}return tile}
function attachCallTrack(track,participant){const tile=callTile(participant.identity);if(track.sid&&tile.querySelector('[data-call-track="'+CSS.escape(track.sid)+'"]'))return;const el=track.attach();el.dataset.callTrack=track.sid||'';if(track.kind==='audio'){el.autoplay=true;tile.append(el);const play=el.play?.();if(play?.catch)play.catch(()=>callStatus('Trình duyệt đang chặn âm thanh. Hãy chạm vào trang để bật tiếng.'))}else{el.autoplay=true;el.playsInline=true;el.muted=participant.identity===currentUser.id;tile.querySelectorAll('video').forEach(v=>v.remove());tile.prepend(el);$('callOverlay')?.classList.remove('voice-only');const play=el.play?.();if(play?.catch)play.catch(()=>{})}}
function detachCallTrack(track){track.detach().forEach(el=>el.remove());document.querySelectorAll('[data-call-track="'+CSS.escape(track.sid||'')+'"]').forEach(el=>el.remove());document.querySelectorAll('.call-tile').forEach(t=>{if(!t.querySelector('video,audio')&&t.dataset.callPeer!==currentUser?.id)t.remove()});if($('callStage')&&!$('callStage').querySelector('video'))$('callOverlay')?.classList.add('voice-only')}
function renderExistingCallTracks(){if(!livekitRoom)return;livekitRoom.remoteParticipants.forEach(p=>p.trackPublications.forEach(pub=>{if(pub.isSubscribed&&pub.track)attachCallTrack(pub.track,p)}));livekitRoom.localParticipant.trackPublications.forEach(pub=>{if(pub.track&&pub.track.kind==='video')attachCallTrack(pub.track,livekitRoom.localParticipant)})}
function openCallPanel(){
 if(!currentChannel){alert('Hãy chọn một kênh trước khi gọi.');return}
 if($('callOverlay'))return;
 const root=document.createElement('section');root.id='callOverlay';root.className='call-overlay voice-only';
 root.innerHTML='<div class="call-head"><strong>◉　Gọi trong #'+esc(currentChannel.name)+'</strong><button class="icon-btn" id="closeCallPanel" title="Thu nhỏ">－</button></div><div class="call-stage" id="callStage"><div class="call-tile"><div class="call-name">Đang chờ kết nối...</div></div></div><div class="call-status" id="callStatus">Chưa kết nối</div><div class="call-settings"><label>Độ phân giải <select id="shareResolution"><option value="1080">1080p</option><option value="1440">1440p</option><option value="720">720p</option><option value="480">480p</option></select></label><label>FPS <select id="shareFps"><option>60</option><option selected>30</option><option>50</option><option>25</option><option>15</option></select></label><label>Bitrate <select id="shareBitrate"><option value="4000000">4 Mbps</option><option value="8000000" selected>8 Mbps</option><option value="12000000">12 Mbps</option><option value="20000000">20 Mbps</option></select></label></div><div class="call-controls"><button id="callMic" class="is-on" title="Tắt mic" aria-label="Tắt mic">🎙</button><button id="callCamera" title="Bật camera" aria-label="Bật camera">◉</button><button id="callScreen" title="Chia sẻ màn hình" aria-label="Chia sẻ màn hình">▧</button><button class="hangup" id="callLeave" title="Kết thúc cuộc gọi" aria-label="Kết thúc cuộc gọi">×</button></div>';
 document.body.append(root);
 $('closeCallPanel').onclick=()=>{root.classList.toggle('minimized');$('closeCallPanel').textContent=root.classList.contains('minimized')?'□':'－'};
 $('callMic').onclick=async()=>{if(!livekitRoom)return;const btn=$('callMic');btn.disabled=true;try{const next=!callMicOn;await livekitRoom.localParticipant.setMicrophoneEnabled(next);callMicOn=next;btn.textContent=callMicOn?'🎙':'🔇';btn.title=callMicOn?'Tắt mic':'Bật mic';btn.setAttribute('aria-label',btn.title);btn.classList.toggle('is-on',callMicOn);btn.classList.toggle('is-muted',!callMicOn);callStatus(callMicOn?'Micro đang bật':'Micro đã tắt')}catch(e){callStatus('Không thể đổi trạng thái micro: '+(e.message||e));}finally{btn.disabled=false}};
 $('callCamera').onclick=async()=>{if(!livekitRoom)return;const btn=$('callCamera');btn.disabled=true;try{const next=!callCameraOn;await livekitRoom.localParticipant.setCameraEnabled(next);callCameraOn=next;btn.textContent=callCameraOn?'▣':'◉';btn.title=callCameraOn?'Tắt camera':'Bật camera';btn.setAttribute('aria-label',btn.title);btn.classList.toggle('is-on',callCameraOn);renderExistingCallTracks();if(callCameraOn)$('callOverlay')?.classList.remove('voice-only');else if(!callScreenOn)$('callOverlay')?.classList.add('voice-only')}catch(e){callStatus('Không thể bật/tắt camera: '+(e.message||e))}finally{btn.disabled=false}};
 $('callScreen').onclick=async()=>{if(!livekitRoom)return;try{if(!callScreenOn){const h=Number($('shareResolution').value),fps=Number($('shareFps').value),bitrate=Number($('shareBitrate').value);await livekitRoom.localParticipant.setScreenShareEnabled(true,{audio:true,resolution:{width:Math.round(h*16/9),height:h},contentHint:'detail'},{screenShareEncoding:{maxBitrate:bitrate,maxFramerate:fps,priority:'high'},screenShareSimulcastLayers:[window.LivekitClient.VideoPresets.h360,window.LivekitClient.VideoPresets.h720],simulcast:true,degradationPreference:'maintain-resolution'});callScreenOn=true;$('callOverlay').classList.remove('voice-only');$('callScreen').textContent='▧ Dừng chia sẻ';callStatus('Đang chia sẻ • '+h+'p / '+fps+' FPS / '+(bitrate/1000000)+' Mbps')}else{await livekitRoom.localParticipant.setScreenShareEnabled(false);callScreenOn=false;$('callOverlay').classList.add('voice-only');$('callScreen').textContent='▧ Chia sẻ màn hình';callStatus('Đã dừng chia sẻ màn hình')}}catch(e){callScreenOn=false;$('callOverlay')?.classList.add('voice-only');$('callScreen').textContent='▧ Chia sẻ màn hình';callStatus('Không thể chia sẻ màn hình: '+e.message)}};
 $('callLeave').onclick=leaveCall;
 ['shareResolution','shareFps','shareBitrate'].forEach(id=>$(id).addEventListener('change',()=>{if(callScreenOn)callStatus('Thông số mới sẽ áp dụng khi bắt đầu chia sẻ màn hình lần tiếp theo.')}));
}
function applyReceiveQuality(){/* Chất lượng nhận không thể vượt quá chất lượng nguồn phát; FPS được giới hạn bởi bên chia sẻ. */}
async function startCall(){
 if(!currentChannel){alert('Hãy chọn một kênh trước khi gọi.');return}
 openCallPanel();if(livekitRoom){if(livekitCallChannelId!==currentChannel.id)callStatus('Bạn đang ở phòng thoại khác. Hãy rời phòng đó trước.');else callStatus('Bạn đang ở trong cuộc gọi này.');return}if(callConnecting){callStatus('Đang kết nối, vui lòng chờ...');return}
 if(!window.LivekitClient){callStatus('Không tải được thư viện gọi LiveKit. Hãy tải lại trang.');return}
 callConnecting=true;callStatus('Đang xác thực và kết nối...');
 try{
  const {data:sessionData}=await db.auth.getSession();if(!sessionData.session)throw Error('Phiên đăng nhập đã hết hạn.');
  const {data,error}=await db.functions.invoke('livekit-token',{body:{channelId:currentChannel.id}});if(error){let detail='';try{const response=error.context;if(response&&typeof response.clone==='function'){const payload=await response.clone().json();detail=[payload.error,payload.missing?.length?'Thiếu: '+payload.missing.join(', '):'',payload.detail].filter(Boolean).join(' — ')}}catch{}throw Error(detail||error.message||'Không lấy được token cuộc gọi.')}if(!data?.token||!data?.serverUrl)throw Error(data?.error||'Máy chủ chưa trả token.');
  const lk=window.LivekitClient;livekitCallChannelId=currentChannel.id;
  livekitRoom=new lk.Room({adaptiveStream:true,dynacast:true,videoCaptureDefaults:{resolution:lk.VideoPresets.h720.resolution},publishDefaults:{simulcast:true,screenShareSimulcastLayers:[lk.VideoPresets.h360,lk.VideoPresets.h720],screenShareEncoding:{maxBitrate:8000000,maxFramerate:30}}});
  livekitRoom.on(lk.RoomEvent.TrackSubscribed,(track,publication,participant)=>{attachCallTrack(track,participant);if(track.kind==='video'){$('callOverlay')?.classList.remove('voice-only');applyReceiveQuality();}callStatus('Đã kết nối • '+(livekitRoom.remoteParticipants.size+1)+' người')});
  livekitRoom.on(lk.RoomEvent.TrackUnsubscribed,(track)=>detachCallTrack(track));
  livekitRoom.on(lk.RoomEvent.LocalTrackUnpublished,(publication)=>{if(publication.track)detachCallTrack(publication.track)});
  livekitRoom.on(lk.RoomEvent.ParticipantConnected,p=>{callTile(p.identity);callStatus('Đã kết nối • '+(livekitRoom.remoteParticipants.size+1)+' người')});
  livekitRoom.on(lk.RoomEvent.ParticipantDisconnected,p=>{document.querySelector('[data-call-peer="'+CSS.escape(p.identity)+'"]')?.remove();callStatus('Một thành viên đã rời cuộc gọi')});
  livekitRoom.on(lk.RoomEvent.Disconnected,()=>{callStatus('Đã ngắt kết nối')});
  livekitRoom.on(lk.RoomEvent.LocalTrackPublished,(publication,participant)=>{if(publication.track&&publication.track.kind==='video')attachCallTrack(publication.track,participant)});
  await livekitRoom.connect(data.serverUrl,data.token);
  await livekitRoom.localParticipant.setMicrophoneEnabled(true);callMicOn=true;
  $('callMic').textContent='🎙';$('callMic').title='Tắt mic';$('callMic').classList.add('is-on');$('callMic').classList.remove('is-muted');callTile(currentUser.id);callStatus('Đã vào phòng thoại • Chờ thành viên khác tham gia');
 }catch(e){callStatus('Lỗi kết nối: '+(e.message||'Không rõ nguyên nhân'));if(livekitRoom){try{await livekitRoom.disconnect()}catch{}livekitRoom=null}livekitCallChannelId=null;}finally{callConnecting=false}
}
async function leaveCall(){if(livekitRoom){try{await livekitRoom.disconnect()}catch{}livekitRoom=null}livekitCallChannelId=null;callMicOn=true;callCameraOn=false;callScreenOn=false;callConnecting=false;$('callOverlay')?.remove()}
$('callBtn').onclick=startCall;

db.auth.getSession().then(async({data})=>{if(data.session){currentUser=data.session.user;try{await enterApp()}catch(e){console.error(e);alert('Không tải được Gaming Hub: '+e.message)}}});
db.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;showAuth()}});
</script>
</body>
